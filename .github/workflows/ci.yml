name: ZWebGL G0-G5

on:
  push:
    branches: [master, develop]
    paths: &gate-paths
      - "Assets/**"
      - "README.md"
      - "Packages/**"
      - "ProjectSettings/**"
      - "Server/**"
      - ".github/workflows/**"
      - "scripts/**"
      - "ci/**"
      - "docs/superpowers/specs/2026-07-16-project-repair-evidence.json"
      - "docs/superpowers/evidence/**"
  pull_request:
    branches: [master]
    paths: *gate-paths

permissions:
  contents: read
  checks: write

concurrency:
  group: zweb-gates-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 2022.3.62f3c1
  DOTNET_VERSION: 8.0.x

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ci/package-lock.json
      - run: npm ci --prefix ci --ignore-scripts
      - name: Install audit runner tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Run repository-safe contracts
        timeout-minutes: 5
        run: node --test scripts/audit/evidence-ledger.test.mjs scripts/ci/*.test.mjs scripts/oss/*.test.mjs
      - run: PYTHONPATH=scripts/ci python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - run: node scripts/audit/evidence-ledger.mjs validate --ledger docs/superpowers/specs/2026-07-16-project-repair-evidence.json
      - run: scripts/repair/audit-meta.sh "$PWD"
      - name: Clean tree
        run: test -z "$(git status --porcelain --untracked-files=all)"

  unity-tests:
    needs: audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        testMode: [EditMode, PlayMode]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ env.UNITY_VERSION }}-${{ matrix.testMode }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-${{ env.UNITY_VERSION }}-${{ matrix.testMode }}-
      - name: Require Unity license
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "UNITY_LICENSE is missing; Unity CI is blocked."
            exit 1
          fi
      - name: Unity ${{ matrix.testMode }}
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: ${{ matrix.testMode }}
          artifactsPath: ${{ runner.temp }}/unity-${{ matrix.testMode }}
          checkName: Unity ${{ matrix.testMode }} ${{ env.UNITY_VERSION }}
          customParameters: -nographics -batchmode
      - name: Validate nonzero required tests
        run: python3 scripts/ci/validate-unity-results.py --mode "${{ matrix.testMode }}" --manifest ci/required-tests.json --results "${{ runner.temp }}/unity-${{ matrix.testMode }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-${{ matrix.testMode }}
          path: ${{ runner.temp }}/unity-${{ matrix.testMode }}
      - name: Clean tree
        run: test -z "$(git status --porcelain --untracked-files=all)"

  framework-dotnet:
    needs: audit
    runs-on: ubuntu-latest
    env:
      ZWEB_REPO_ROOT: ${{ github.workspace }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ECS
            project: Server/ECS.Tests/ZWebGLFrameWork.ECS.ServerTests.csproj
            lockfile: Server/ECS.Tests/packages.lock.json
            result: ecs.trx
            minimum: 6
            filter: ''
            classes: ''
          - name: Network
            project: Server/Network.Tests/ZWebGLFrameWork.Network.ServerTests.csproj
            lockfile: Server/Network.Tests/packages.lock.json
            result: network.trx
            minimum: 35
            filter: ''
            classes: ''
          - name: SimulationCore
            project: Server/SimulationCore.Tests/ZWebGLFrameWork.SimulationCore.ServerTests.csproj
            lockfile: Server/SimulationCore.Tests/packages.lock.json
            result: simulation.trx
            minimum: 132
            filter: FullyQualifiedName~ZWebGLFrameWork.SimulationCore.ServerTests.ContentManifestGoldenTests|FullyQualifiedName~ZWebGLFrameWork.SimulationCore.ServerTests.DeterministicRandomCompatibilityTests|FullyQualifiedName~ZWebGLFrameWork.SimulationCore.ServerTests.LogicIntCompatibilityTests|FullyQualifiedName~ZWebGLFrameWork.SimulationCore.ServerTests.ModeBehaviorGoldenTests|FullyQualifiedName~ZWebGLFrameWork.SimulationCore.ServerTests.SessionCommandTests|FullyQualifiedName~ZWebGLFrameWork.SimulationCore.Tests.SessionDeterminismTests|FullyQualifiedName~ZWebGLFrameWork.SimulationCore.Tests.ModeBehaviorTests|FullyQualifiedName~ZWebGLFrameWork.SimulationCore.Tests.CoreTargetingTests|FullyQualifiedName~ZWebGLFrameWork.SimulationCore.Tests.SimSystemGroupTests|FullyQualifiedName~ZWebGLFrameWork.SimulationCore.Tests.SessionTerminalTests
            classes: ZWebGLFrameWork.SimulationCore.ServerTests.ContentManifestGoldenTests,ZWebGLFrameWork.SimulationCore.ServerTests.DeterministicRandomCompatibilityTests,ZWebGLFrameWork.SimulationCore.ServerTests.LogicIntCompatibilityTests,ZWebGLFrameWork.SimulationCore.ServerTests.ModeBehaviorGoldenTests,ZWebGLFrameWork.SimulationCore.ServerTests.SessionCommandTests,ZWebGLFrameWork.SimulationCore.Tests.SessionDeterminismTests,ZWebGLFrameWork.SimulationCore.Tests.ModeBehaviorTests,ZWebGLFrameWork.SimulationCore.Tests.CoreTargetingTests,ZWebGLFrameWork.SimulationCore.Tests.SimSystemGroupTests,ZWebGLFrameWork.SimulationCore.Tests.SessionTerminalTests
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: ${{ matrix.lockfile }}
      - name: Locked restore
        shell: bash
        env:
          DOTNET_ARTIFACTS: ${{ runner.temp }}/dotnet-artifacts
        run: dotnet restore "${{ matrix.project }}" --locked-mode --artifacts-path "$DOTNET_ARTIFACTS"
      - name: Release build, warnings as errors
        shell: bash
        env:
          DOTNET_ARTIFACTS: ${{ runner.temp }}/dotnet-artifacts
        run: dotnet build "${{ matrix.project }}" -c Release --no-restore --warnaserror --artifacts-path "$DOTNET_ARTIFACTS"
      - name: Release tests
        shell: bash
        env:
          DOTNET_ARTIFACTS: ${{ runner.temp }}/dotnet-artifacts
          TEST_FILTER: ${{ matrix.filter }}
        run: |
          filter=()
          if [ -n "$TEST_FILTER" ]; then filter=(--filter "$TEST_FILTER"); fi
          dotnet test "${{ matrix.project }}" -c Release --no-build --no-restore --warnaserror --artifacts-path "$DOTNET_ARTIFACTS" "${filter[@]}" --logger "trx;LogFileName=${{ matrix.result }}" --results-directory "${{ runner.temp }}/framework-dotnet-tests"
      - name: Require nonzero passing tests
        shell: bash
        run: python3 scripts/ci/validate-trx.py --results "${{ runner.temp }}/framework-dotnet-tests/${{ matrix.result }}" --minimum "${{ matrix.minimum }}"
      - if: matrix.name == 'SimulationCore'
        name: Require exact SimulationCore test classes
        run: python3 scripts/ci/validate-simulation-trx.py --results "${{ runner.temp }}/framework-dotnet-tests/${{ matrix.result }}" --classes "${{ matrix.classes }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-dotnet-tests-${{ matrix.name }}
          path: ${{ runner.temp }}/framework-dotnet-tests
      - name: Clean tree
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=all)"

  build:
    needs: [unity-tests, framework-dotnet]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - targetPlatform: WebGL
            buildMethod: ZWebGLFrameWork.Editor.BuildScript.BuildWebGL
            artifactDir: WebGL
            summary: WebGL
          - targetPlatform: StandaloneWindows64
            buildMethod: ZWebGLFrameWork.Editor.BuildScript.BuildWindows
            artifactDir: Windows
            summary: StandaloneWindows64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Require Unity license
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "UNITY_LICENSE is missing; Unity CI is blocked."
            exit 1
          fi
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          ZWEB_EVIDENCE_ROOT: ${{ runner.temp }}/zweb-${{ matrix.targetPlatform }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: ${{ matrix.targetPlatform }}
          buildMethod: ${{ matrix.buildMethod }}
          buildsPath: ${{ runner.temp }}/zweb-${{ matrix.targetPlatform }}/builds
          allowDirtyBuild: false
      - name: Validate build summary and hashes
        env:
          ZWEB_EVIDENCE_ROOT: ${{ runner.temp }}/zweb-${{ matrix.targetPlatform }}
        run: node scripts/ci/validate-build-summary.mjs --summary "$ZWEB_EVIDENCE_ROOT/builds/Reports/${{ matrix.summary }}.json" --target "${{ matrix.summary }}" --artifact-root "$ZWEB_EVIDENCE_ROOT"
      - if: matrix.targetPlatform == 'WebGL'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ci/package-lock.json
      - if: matrix.targetPlatform == 'WebGL'
        name: Install locked smoke dependencies
        run: npm ci --prefix ci --ignore-scripts
      - if: matrix.targetPlatform == 'WebGL'
        name: Install Chromium and local trust tools
        run: |
          cd ci
          npx --no-install playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y libnss3-tools
      - if: matrix.targetPlatform == 'WebGL'
        name: Create and trust local HTTPS CA
        run: |
          certs="${{ runner.temp }}/zweb-certs"
          mkdir -p "$certs"
          openssl genrsa -out "$certs/ca.key" 2048
          openssl req -x509 -new -nodes -key "$certs/ca.key" -sha256 -days 1 -subj '/CN=ZWeb CI Local CA' -out "$certs/ca.crt"
          openssl genrsa -out "$certs/server.key" 2048
          openssl req -new -key "$certs/server.key" -subj '/CN=localhost' -out "$certs/server.csr"
          printf 'subjectAltName=DNS:localhost,IP:127.0.0.1\nextendedKeyUsage=serverAuth\n' > "$certs/server.ext"
          openssl x509 -req -in "$certs/server.csr" -CA "$certs/ca.crt" -CAkey "$certs/ca.key" -CAcreateserial -out "$certs/server.crt" -days 1 -sha256 -extfile "$certs/server.ext"
          sudo cp "$certs/ca.crt" /usr/local/share/ca-certificates/zweb-ci-local.crt
          sudo update-ca-certificates
          mkdir -p "$HOME/.pki/nssdb"
          certutil -d "sql:$HOME/.pki/nssdb" -N --empty-password 2>/dev/null || true
          certutil -d "sql:$HOME/.pki/nssdb" -A -t 'C,,' -n 'ZWeb CI Local CA' -i "$certs/ca.crt"
      - if: matrix.targetPlatform == 'WebGL'
        name: Trusted HTTPS WebGL smoke
        env:
          ZWEB_PLAYWRIGHT_JSON: ${{ runner.temp }}/webgl-playwright.json
        run: |
          certs="${{ runner.temp }}/zweb-certs"
          node scripts/ci/serve-https.mjs --root "$ZWEB_EVIDENCE_ROOT/builds/WebGL" --cert "$certs/server.crt" --key "$certs/server.key" --port 8443 > "${{ runner.temp }}/https-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do curl --fail --silent https://localhost:8443/ >/dev/null && break; sleep 1; done
          curl --fail --silent https://localhost:8443/ >/dev/null
          cd ci
          npx --no-install playwright test --config smoke/playwright.config.mjs smoke/webgl.spec.mjs
      - if: matrix.targetPlatform == 'WebGL'
        name: Upload WebGL smoke report
        uses: actions/upload-artifact@v4
        with:
          name: webgl-smoke-report
          path: ${{ runner.temp }}/webgl-playwright.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.targetPlatform }}
          path: |
            ${{ runner.temp }}/zweb-${{ matrix.targetPlatform }}/builds/${{ matrix.artifactDir }}
            ${{ runner.temp }}/zweb-${{ matrix.targetPlatform }}/builds/Reports/${{ matrix.summary }}.json
      - name: Clean tree
        run: test -z "$(git status --porcelain --untracked-files=all)"

  windows-smoke:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: build-StandaloneWindows64
          path: ${{ runner.temp }}/windows-build
      - name: Start, await readiness, and request graceful exit
        shell: pwsh
        run: |
          $executables = @(Get-ChildItem "${{ runner.temp }}/windows-build" -Recurse -Filter ZWebGLFrameWork.exe)
          if ($executables.Count -ne 1) { throw "Expected exactly one ZWebGLFrameWork.exe, found $($executables.Count)" }
          $exe = $executables[0]
          $log = "${{ runner.temp }}/windows-player.log"
          $exitFile = "${{ runner.temp }}/zweb-smoke-exit"
          $process = Start-Process -FilePath $exe.FullName -PassThru -ArgumentList @("-logFile", $log, "-zwebSmokeExitFile", $exitFile, "-screen-width", "1280", "-screen-height", "720", "-screen-fullscreen", "0")
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $deadline) {
            if ((Test-Path $log) -and (Select-String -Path $log -SimpleMatch '"event":"app-ready"' -Quiet)) { break }
            if ($process.HasExited) { throw "Player exited before readiness with $($process.ExitCode)" }
            Start-Sleep -Milliseconds 250
          }
          if (-not (Select-String -Path $log -SimpleMatch '"event":"app-ready"' -Quiet)) { throw "app-ready timeout" }
          New-Item -ItemType File -Path $exitFile -Force | Out-Null
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw "graceful exit timeout" }
          if ($process.ExitCode -ne 0) { throw "Player exit code $($process.ExitCode)" }
          node scripts/ci/validate-player-log.mjs --log $log --allowlist ci/smoke/windows-log-allowlist.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-log
          path: ${{ runner.temp }}/windows-player.log
      - name: Clean tree
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=all)"
